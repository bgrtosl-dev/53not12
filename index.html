<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>35 out of 53, not 12</title>
    <link rel="stylesheet" href="style.css">
    <!-- VexFlow CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js"></script>
</head>
<body>
    <header class="app-header">
        <h1>35 out of 53, not 12</h1>
        <div class="header-icons">
            <button id="help-btn" title="Help">?</button>
            <button id="qr-btn" title="QR Code">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <path d="M3 14h7v7H3z"/>
                    <path d="M6 6h1v1H6z M17 6h1v1h-1z M17 17h1v1h-1z"/>
                    <path d="M14 10h3 M10 14v3 M14 21h3 M21 10v3"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="app-container">
        <!-- Controls Bar -->
        <div class="controls-bar">
            <!-- Left Group: Step navigation (-- to ++) and Key Signature Dropdown -->
            <div class="controls-left">
                <button id="step-minus2" class="step-btn">--</button>
                <button id="step-minus1" class="step-btn">-</button>
                <select id="key-sig-dropdown">
                    <option value="???">???</option>
                </select>
                <button id="step-plus1" class="step-btn">+</button>
                <button id="step-plus2" class="step-btn">++</button>
            </div>

            <!-- Right Group: Enharmony & Min Scale Selectors -->
            <div class="controls-right">
                <button id="cycle-alt-btn" class="ctrl-btn">#</button>
                <button id="cycle-min-btn" class="ctrl-btn">hrm min</button>
            </div>
        </div>

        <!-- Interactive Keyboard (A to G) -->
        <div class="keyboard-container" id="keyboard"></div>

        <!-- Scales Section -->
        <div class="scales-section">
            <h2 id="scales-heading">Matching Scales</h2>
            <div id="scales-list"></div>
        </div>
    </main>

    <!-- QR Code Modal -->
    <div id="qr-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>35 out of 53, not 12</h3>
            <div class="qr-code-wrapper">
                <img id="qr-img" src="" alt="App QR Code" width="180" height="180">
            </div>
            <a id="qr-url" href="#" target="_blank" class="modal-url"></a>
        </div>
    </div>

    <!-- Help Modal -->
    <div id="help-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Color Guide</h3>
            <div style="text-align: left; font-size: 0.95rem; margin: 0.5rem 0; width: 100%; line-height: 1.5;">
                <p style="margin-bottom: 0.35rem;"><span style="color: #137333; font-weight: bold;">■ Green:</span> Differentiating keys where multiple scales diverge.</p>
                <p style="margin-bottom: 0.35rem;"><span style="color: #1967d2; font-weight: bold;">■ Light Blue:</span> Keys with non-empty, actionable alteration options.</p>
            </div>
            <button id="close-help" class="action-btn">Close</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/tools.js"></script>
    <script src="js/vxflw_scales.js"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
